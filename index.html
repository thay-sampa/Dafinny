<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2a2350">
  <title>Feliz aniversário!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="ceu" aria-hidden="true"></canvas>

  <main class="palco">
    <div class="fileira">
      <button class="icone" data-abre="toca-discos" aria-label="Toca-discos" title="Toca-discos" style="--atraso: 0s; --inclinacao: -9deg">
        <canvas width="32" height="32" data-sprite="vitrola"></canvas>
      </button>
      <button class="icone" data-abre="bolo" aria-label="Bolo" title="Bolo" style="--atraso: -0.8s; --inclinacao: 5deg">
        <canvas width="32" height="32" data-sprite="bolo"></canvas>
      </button>
      <button class="icone" id="horario" style="--atraso: -1.6s; --inclinacao: 8deg">
        <canvas width="32" height="32" data-sprite="horario"></canvas>
      </button>
    </div>

    <h1 id="titulo" class="titulo" aria-label="Feliz aniversário!"></h1>

    <div class="fileira">
      <button class="icone" data-abre="galeria" aria-label="Fotos" title="Fotos" style="--atraso: -1.1s; --inclinacao: 7deg">
        <canvas width="32" height="32" data-sprite="fotos"></canvas>
      </button>
      <button class="icone" data-abre="amizade" aria-label="Tempo de amizade" title="Tempo de amizade" style="--atraso: -2.4s; --inclinacao: -8deg">
        <canvas width="32" height="32" data-sprite="amizade"></canvas>
      </button>
      <button class="icone" data-abre="carta" aria-label="Carta" title="Carta" style="--atraso: -0.5s; --inclinacao: 7deg">
        <canvas width="32" height="32" data-sprite="carta"></canvas>
      </button>
    </div>
  </main>

  <div id="mini" class="mini" hidden>
    <button id="mini-abrir" class="mini-nome" aria-label="Abrir o toca-discos"></button>
    <button id="mini-play" class="botao botao-icone"></button>
  </div>

  <dialog class="janela" id="toca-discos" aria-labelledby="titulo-discos">
    <header class="barra">
      <h2 id="titulo-discos">Toca-discos</h2>
      <button class="fechar" aria-label="Fechar">X</button>
    </header>
    <div class="miolo discos-miolo">
      <div class="player">
        <canvas id="capa-disco" class="capa-disco" width="64" height="64" aria-hidden="true"></canvas>
        <div class="player-info">
          <p id="faixa-nome" class="faixa-nome">Escolha uma música</p>
          <p id="faixa-artista" class="faixa-artista"></p>
          <input id="progresso" type="range" min="0" max="100" value="0" step="1" aria-label="Posição da música" disabled>
          <p class="tempos"><span id="tempo-atual">0:00</span><span id="tempo-total">0:00</span></p>
          <div class="controles">
            <button id="anterior" class="botao botao-icone" aria-label="Música anterior"></button>
            <button id="play" class="botao botao-icone botao-play"></button>
            <button id="proxima" class="botao botao-icone" aria-label="Próxima música"></button>
          </div>
        </div>
      </div>
      <p id="aviso-musica" class="aviso" role="status"></p>
      <ol id="faixas" class="faixas"></ol>
    </div>
  </dialog>

  <dialog class="janela janela-larga" id="galeria" aria-labelledby="titulo-galeria">
    <header class="barra">
      <h2 id="titulo-galeria">Fotos</h2>
      <button class="fechar" aria-label="Fechar">X</button>
    </header>
    <div class="miolo fotos-miolo">
      <div class="luzinhas" aria-hidden="true"></div>
      <div id="grade-fotos" class="grade-fotos"></div>
    </div>
  </dialog>

  <dialog class="foto-cheia" id="foto-cheia" aria-label="Foto ampliada">
    <button class="fechar" aria-label="Fechar">X</button>
    <div id="foto-palco" class="foto-palco"></div>
    <p id="foto-legenda" class="foto-legenda"></p>
    <div class="foto-setas">
      <button id="foto-anterior" class="botao botao-icone" aria-label="Foto anterior"></button>
      <button id="foto-proxima" class="botao botao-icone" aria-label="Próxima foto"></button>
    </div>
  </dialog>

  <dialog class="janela" id="amizade" aria-labelledby="titulo-amizade">
    <header class="barra">
      <h2 id="titulo-amizade">Nossa amizade</h2>
      <button class="fechar" aria-label="Fechar">X</button>
    </header>
    <div class="miolo amizade-miolo">
      <div id="coracoes-fundo" class="coracoes-fundo" aria-hidden="true"></div>
      <p id="amizade-frase" class="amizade-frase"></p>
      <div id="contador" class="contador" role="timer">
        <div class="flip-bloco flip-dias"><div id="conta-dias" class="flip" aria-hidden="true"></div><span id="rotulo-dias" aria-hidden="true">dias</span></div>
        <div class="flip-bloco"><div id="conta-horas" class="flip" aria-hidden="true"></div><span id="rotulo-horas" aria-hidden="true">horas</span></div>
        <div class="flip-bloco"><div id="conta-minutos" class="flip" aria-hidden="true"></div><span id="rotulo-minutos" aria-hidden="true">minutos</span></div>
        <div class="flip-bloco"><div id="conta-segundos" class="flip" aria-hidden="true"></div><span id="rotulo-segundos" aria-hidden="true">segundos</span></div>
      </div>
    </div>
  </dialog>

  <dialog class="janela" id="carta" aria-labelledby="titulo-carta">
    <header class="barra">
      <h2 id="titulo-carta">Carta</h2>
      <button class="fechar" aria-label="Fechar">X</button>
    </header>
    <div id="carta-miolo" class="miolo carta-miolo">
      <canvas id="carta-canvas" aria-hidden="true"></canvas>
      <div id="carta-fechada" class="carta-fechada">
        <button id="carta-envelope" class="carta-envelope" aria-label="Abrir a carta"></button>
        <p id="carta-dica" class="carta-dica">Toque no envelope</p>
      </div>
      <div id="carta-aberta" class="carta-aberta" hidden>
        <div class="carta-folha">
          <article id="carta-papel" class="carta-papel" tabindex="0">
            <p id="carta-texto"></p>
            <p id="carta-fecho" class="carta-fecho"></p>
          </article>
        </div>
        <button id="carta-guardar" class="botao">Guardar a carta</button>
      </div>
    </div>
  </dialog>

  <dialog class="janela" id="bolo" aria-labelledby="titulo-bolo">
    <header class="barra">
      <h2 id="titulo-bolo">Bolo</h2>
      <button class="fechar" aria-label="Fechar">X</button>
    </header>
    <div class="miolo bolo-miolo">
      <p id="bolo-mensagem" class="bolo-mensagem" role="status"></p>
      <div class="bolo-cena">
        <canvas id="bolo-canvas" width="128" height="104" aria-hidden="true"></canvas>
        <div id="velas" class="velas"></div>
      </div>
      <button id="soprar" class="botao soprar"></button>
    </div>
    <canvas id="confete" class="confete" aria-hidden="true"></canvas>
  </dialog>

  <audio id="audio" preload="metadata"></audio>

  <script src="conteudo.js"></script>
  <script src="app.js"></script>
</body>
</html>
